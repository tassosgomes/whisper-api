[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meeting-transcriber"
version = "0.1.0"
description = "Transcrição offline de reuniões com faster-whisper"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "huggingface-hub==0.34.4",
    "psutil==7.0.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.10",
]

[tool.setuptools.packages.find]
include = ["app*"]
