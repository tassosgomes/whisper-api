services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whisper}
      POSTGRES_USER: ${POSTGRES_USER:-whisper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-placeholder-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  transcriber:
    image: local-meeting-transcriber:dev
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/input:${APP_INPUT_DIR:-/data/input}:ro
      - ./data/output:${APP_OUTPUT_DIR:-/data/output}:rw
      - ./models:/models:ro
    environment:
      APP_INPUT_DIR: ${APP_INPUT_DIR:-/data/input}
      APP_OUTPUT_DIR: ${APP_OUTPUT_DIR:-/data/output}
      CPU_LIMIT: ${CPU_LIMIT:-8}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-medium}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/${WHISPER_MODEL_NAME:-medium}}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-${CPU_LIMIT:-8}}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-whisper}
      DATABASE_USER: ${POSTGRES_USER:-whisper}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-placeholder-only}
      SOURCE_URL_ENCRYPTION_KEY: ${SOURCE_URL_ENCRYPTION_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: ${CPU_LIMIT:-8}
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-whisper_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-whisper_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local-test-only}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-prep:
    image: local-meeting-transcriber:dev
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "scripts/prepare_models.py"]
    command: ["small", "medium", "large-v3"]
    volumes:
      - ./models:/models:rw
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_XET: "1"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

  offline:
    image: local-meeting-transcriber:dev
    profiles: ["tools"]
    network_mode: none
    volumes:
      - ./data/input:${APP_INPUT_DIR:-/data/input}:ro
      - ./data/output:${APP_OUTPUT_DIR:-/data/output}:rw
      - ./models:/models:ro
    environment:
      APP_INPUT_DIR: ${APP_INPUT_DIR:-/data/input}
      APP_OUTPUT_DIR: ${APP_OUTPUT_DIR:-/data/output}
      CPU_LIMIT: ${CPU_LIMIT:-8}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-medium}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/${WHISPER_MODEL_NAME:-medium}}
      WHISPER_THREADS: ${WHISPER_THREADS:-${CPU_LIMIT:-8}}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: ${CPU_LIMIT:-8}
    init: true

volumes:
  postgres_data:
  postgres_test_data:
